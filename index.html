<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Color Based Calculator</title>

<style>
/* ===== Animated Background ===== */
body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(120deg, #667eea, #764ba2, #43cea2);
  background-size: 400% 400%;
  animation: bgMove 10s ease infinite;
  font-family: "Segoe UI", sans-serif;
}

@keyframes bgMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ===== Calculator Card ===== */
.calculator {
  width: 300px;
  padding: 20px;
  border-radius: 20px;
  backdrop-filter: blur(12px);
  background: rgba(255, 255, 255, 0.25);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
}

/* ===== Display ===== */
#display {
  width: 100%;
  height: 60px;
  border-radius: 15px;
  border: none;
  font-size: 24px;
  text-align: right;
  padding: 10px;
  margin-bottom: 15px;
  transition: background 0.4s, box-shadow 0.4s;
}

/* ===== Buttons ===== */
button {
  width: 60px;
  height: 50px;
  margin: 5px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: rgba(255, 255, 255, 0.85);
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 14px rgba(0,0,0,0.3);
}

button:active {
  transform: scale(0.95);
}

.equal { background: gold; }
.clear { background: tomato; }
</style>
</head>

<body>

<div class="calculator">
  <input id="display" readonly>

  <div>
    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button onclick="setOperator('+')">+</button>
  </div>

  <div>
    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button onclick="setOperator('-')">−</button>
  </div>

  <div>
    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button onclick="setOperator('*')">×</button>
  </div>

  <div>
    <button onclick="appendValue('0')">0</button>
    <button class="equal" onclick="calculateResult()">=</button>
    <button class="clear" onclick="clearAll()">AC</button>
    <button onclick="setOperator('/')">÷</button>
  </div>
</div>

<script>
/* ===== JavaScript Logic (ES6+) ===== */

const display = document.getElementById("display");
let currentOperator = null;

const operatorColors = {
  "+": "#7CFC00",
  "-": "#FF6B6B",
  "*": "#4D96FF",
  "/": "#FFA500"
};

const appendValue = value => {
  display.value += value;
};

const setOperator = operator => {
  currentOperator = operator;
  display.style.background = operatorColors[operator];
  display.style.boxShadow = `0 0 20px ${operatorColors[operator]}`;
  display.value += operator;
};

const calculateResult = () => {
  if (!currentOperator) return;

  const [a, b] = display.value.split(currentOperator).map(Number);
  let result;

  switch (currentOperator) {
    case "+": result = a + b; break;
    case "-": result = a - b; break;
    case "*": result = a * b; break;
    case "/": result = b !== 0 ? a / b : "Error"; break;
  }

  display.value = result;
};

const clearAll = () => {
  display.value = "";
  display.style.background = "white";
  display.style.boxShadow = "none";
  currentOperator = null;
};
</script>

</body>
</html>
